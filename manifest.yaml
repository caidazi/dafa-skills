schema_version: 1
bundle: caidazi-skills
version: 0.2.5
repository_role:
  user_install_source: "skills and manifest"
  mcp_install_source: "npm package @caidazi/mcp"
  do_not_run_mcp_from_repo: true
env:
  primary_api_key: CAIDAZI_API_KEY
  current_backend_url: CAIDAZI_BASE_URL
  allow_http_test_backend: CAIDAZI_ALLOW_HTTP
mcp:
  server_name: caidazi
  transport: stdio
  npm_package: "@caidazi/mcp"
  command: npx
  args:
    - -y
    - "@caidazi/mcp@latest"
  command_usage: configuration_only_not_query_path
  env:
    CAIDAZI_API_KEY:
      secret: true
      required: true
    CAIDAZI_BASE_URL:
      value: "http://101.126.22.17:5011"
      required_for_current_test_backend: true
    CAIDAZI_ALLOW_HTTP:
      value: "true"
      required_for_current_test_backend: true
  hosted_endpoint: null
  hosted_endpoint_kind: disabled-until-official-https-mcp-is-live
  security:
    tls_required_for_bearer: true
    allow_bearer_over_plain_http_by_default: false
    explicit_plain_http_test_opt_in_env: CAIDAZI_ALLOW_HTTP
    plain_http_scope: "current trusted test backend only"
    local_bridge_instruction: "Default install uses the npm stdio MCP bridge. The bridge exposes standard MCP tools to the Agent and calls the Caidazi backend internally."
    hosted_endpoint_instruction: "Use the hosted HTTPS MCP endpoint only after it passes MCP initialize/list-tools health checks."
  auth:
    type: bearer
    header: Authorization
    env_ref: CAIDAZI_API_KEY
    format: "Bearer {value}"
    secret: true
    redact: true
installation:
  default_mode: npm-installer
  supported_modes:
    - npm-installer
    - stdio-mcp-bridge
    - hosted-mcp
  npm_installer:
    command: "npx -y @caidazi/mcp@latest install --host <claude|codex>"
    installs:
      - caidazi skills
      - caidazi stdio MCP server
    env_required:
      - CAIDAZI_API_KEY
      - CAIDAZI_BASE_URL
      - CAIDAZI_ALLOW_HTTP
    success_condition: "The current Agent's MCP tools/list, /mcp panel, or equivalent tool UI directly shows caidazi tools, including get_real_time_record."
  stdio_mcp_bridge:
    config_instruction: "Use the current Agent's documented MCP installation surface, such as its MCP CLI, UI, plugin system, or documented mcp.json path. Do not guess generic settings paths."
    server_name_ref: mcp.server_name
    transport_ref: mcp.transport
    command_ref: mcp.command
    args_ref: mcp.args
    auth_env_ref: CAIDAZI_API_KEY
    backend_env_ref: CAIDAZI_BASE_URL
    allow_http_env_ref: CAIDAZI_ALLOW_HTTP
    package_ref: mcp.npm_package
    success_condition: "The current Agent's MCP tools/list, /mcp panel, or equivalent tool UI directly shows caidazi tools, including get_real_time_record, without loading a Caidazi skill first."
    failure_conditions:
      - "Only caidazi-* skills are installed."
      - "The MCP package validates from a shell, but the Agent's tool list does not show caidazi."
      - "A generic mcpServers object was written to an unsupported settings file."
      - "The Agent can only mention get_real_time_record after reading a skill file."
  hosted_mcp:
    enabled: false
    endpoint_ref: mcp.hosted_endpoint
    enable_when: "An official HTTPS MCP transport endpoint is deployed and passes health checks."
  skills_only:
    report_as: "Skills-only mode"
    installation_success: false
    limitation: "No Caidazi tools are available; the Agent can only follow the skill output structure. Do not report this as a successful MCP installation."
  host_install_rules:
    prefer_official_host_cli_or_ui: true
    do_not_guess_settings_files: true
    do_not_write_generic_mcpservers_to_plain_settings_json: true
    known_host_examples:
      claude_code:
        install_command_shape: "claude mcp add --scope user caidazi -e CAIDAZI_API_KEY=<secret> -e CAIDAZI_BASE_URL=http://101.126.22.17:5011 -e CAIDAZI_ALLOW_HTTP=true -- npx -y @caidazi/mcp@latest"
        verify_command_shape: "claude mcp get caidazi && use /mcp inside Claude Code"
        invalid_path_example: "~/.claude/settings.json mcpServers"
      codex_cli:
        install_command_shape: "codex mcp add caidazi --env CAIDAZI_API_KEY=<secret> --env CAIDAZI_BASE_URL=http://101.126.22.17:5011 --env CAIDAZI_ALLOW_HTTP=true -- npx -y @caidazi/mcp@latest"
        verify_command_shape: "codex mcp get caidazi"
activation:
  preferred_order:
    - "Install or update caidazi skills."
    - "Configure caidazi MCP through the current Agent's documented MCP flow."
    - "If the current Agent supports MCP, skills, or plugin reload/refresh, run that official refresh in the same session."
    - "Check MCP tools/list or the Agent tool panel for caidazi tools."
    - "If get_real_time_record is directly visible as a host MCP tool, call it directly for the minimal success query."
    - "If caidazi tools are still not visible, ask the user to start a new session and retry the same minimal query."
  same_session:
    attempt_reload_if_supported: true
    do_not_claim_universal_hot_reload: true
    fallback_when_tools_not_visible: "new-session-or-agent-restart"
  minimal_success:
    tool: get_real_time_record
    query: "贵州茅台现在多少钱？"
    forbidden_fallbacks:
      - shell-run-npm-bridge
      - handwritten-json-rpc
      - api-key-in-command-line
backend_api:
  base_url: "http://101.126.22.17:5011"
  endpoint_kind: temporary-plain-http
  tool_registry_path: "/api/tools/registered"
  tool_call_path: "/api/tools/call"
  used_by: "@caidazi/mcp stdio bridge"
  auth:
    type: bearer
    header: Authorization
    env_ref: CAIDAZI_API_KEY
    format: "Bearer {value}"
    secret: true
    redact: true
  safety:
    requires_allow_http_env: CAIDAZI_ALLOW_HTTP
    use_only_when_user_confirms_temporary_test_env: true
    do_not_expose_as_agent_mcp_endpoint: true
    do_not_store_api_key_in_repo_or_shared_config: true
skills:
  included:
    - caidazi-market-pulse
    - caidazi-asset-research
    - caidazi-stock-screener
    - caidazi-user-assets
    - caidazi-finance-search
    - caidazi-fund-etf-research
    - caidazi-macro-research
    - caidazi-portfolio-review
required_mcp:
  direct_tool_routes:
    real_time_asset_quote:
      user_intent: "single asset latest quote, current price, change percent, volume, amount, or intraday quote"
      tool: get_real_time_record
      do_not_load_skill_first: true
      do_not_use: get_asset_overview
      stop_after_tool_result: true
    asset_comparison:
      user_intent: "compare two or more stocks, ETFs, funds, or indexes"
      tool: compare_assets
      canonical_arguments:
        - symbols
        - metrics
        - period
      metrics_allowed:
        - price
        - valuation
        - capital
        - overview
      do_not_use_argument_aliases:
        - assets
        - dimensions
  runtime_usage:
    use_configured_mcp_tools_directly: true
    do_not_shell_run_npm_bridge_for_queries: true
    do_not_handwrite_json_rpc_for_queries: true
    do_not_put_api_key_in_shell_commands: true
  public_tools:
    - extract_assets
    - get_hot_report
    - get_real_time_market_summary
    - get_market_analysis
    - get_macro_analysis
    - get_asset_overview
    - get_real_time_record
    - analyze_capital_flow
    - analyze_technical
    - analyze_fundamentals_financial
    - analyze_fundamentals_valuation
    - investment_search_pro
    - compare_assets
    - screen_stocks
    - get_etf_constituents
    - get_index_related_etfs
    - get_stock_belongings
  account_tools:
    - get_caidazi_user_watchlist
    - get_caidazi_positions_summary
    - get_caidazi_portfolio_snapshot
  smoke_safe_tools:
    - extract_assets
    - get_hot_report
    - get_real_time_market_summary
    - get_market_analysis
    - get_macro_analysis
    - get_real_time_record
  smoke_forbidden_tools:
    - get_caidazi_user_watchlist
    - get_caidazi_positions_summary
    - get_caidazi_portfolio_snapshot
blocked_surface:
  - raw database access
  - internal account tools
  - internal monitor or subscription tools
  - local file or UI-only tools
verification:
  skill_indexing:
    required_when_supported: true
    fallback_mode: MCP-only
  mcp_connection:
    server_name_ref: mcp.server_name
    must_connect_when_secure_transport_available: true
    health_check_required: true
    agent_health_check_required: true
    tools_discovery_required: true
    must_be_direct_host_tools: true
    skill_text_mentions_are_not_tool_discovery: true
  backend_bridge:
    test_registry_ref: backend_api.tool_registry_path
    tool_call_ref: backend_api.tool_call_path
    plain_http_requires_explicit_opt_in: true
  api_key:
    never_print_full_key: true
    never_read_with_printenv: true
    never_store_in_repo: true
    missing_key_instruction: "Ask the user to open 财搭子 App -> 大发 agent 页面 -> 左上角 skill icon -> Skills 页面, then set CAIDAZI_API_KEY through the current Agent's secure configuration path."
  network_smoke_test:
    require_tls_for_authenticated_calls: true
    allowed_tools_ref: required_mcp.smoke_safe_tools
    forbidden_tools_ref: required_mcp.smoke_forbidden_tools
post_install:
  intro_public: "财搭子已接入。你可以让我做市场脉搏、单标的研究、多标的比较、自然语言选股、基金/ETF 研究、宏观分析和资讯检索。"
  intro_account: "如果你的 API Key 已绑定财搭子账户，还可以查看自选、持仓和组合快照，并做轻量复盘。"
  ask: "你想先做哪类任务？"
  sample_queries:
    public:
      - 今天 A 股市场热点是什么？
      - 贵州茅台现在多少钱？
      - 帮我看下宁德时代最近的核心矛盾。
      - 从资金面、技术面、财务和估值四个维度深度分析一下比亚迪。
      - 比亚迪和宁德时代谁更值得跟踪？
      - 找出最近资金强、估值不贵的新能源股票。
    account:
      - 我的自选里今天哪些最值得关注？
